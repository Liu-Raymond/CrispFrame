[project]
name = "crispframe"
version = "2.0.0"
description = "开源视频归档压缩工具：SVT-AV1 直编、容器全量化、三项完整性验证 —— 一键把视频压成可长期保存的档案"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
crispframe = "crispframe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crispframe*"]
exclude = ["tests*", "docs*", "models*", "vendor*"]
